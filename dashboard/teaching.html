<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A1R 拖动示教动作库</title>
<script>if(location.protocol==='file:')location.replace('http://192.168.253.155:8080/');</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>:root{font-family:system-ui,sans-serif;color:#18212f;background:#eef2f6}body{margin:0;padding:24px}.wrap{max-width:1000px;margin:auto}.panel{background:#fff;border:1px solid #dce3eb;border-radius:14px;padding:20px;margin-bottom:16px}h2,h3{margin-top:0}.status,.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dot{width:11px;height:11px;border-radius:50%;background:#c33}.dot.ok{background:#24a36a}label{display:grid;gap:5px;font-size:13px;color:#596579}input,button{font:inherit;border:1px solid #b8c4d1;border-radius:8px;padding:10px 12px;background:#fff}input[type=text]{min-width:240px}button{cursor:pointer}.primary{background:#1769df;color:#fff;border-color:#1769df}.danger{background:#c93636;color:#fff;border-color:#c93636}.stoprec{background:#e58a12;color:#fff;border-color:#e58a12}button:disabled{opacity:.42;cursor:not-allowed}.confirm{display:flex;gap:9px;align-items:flex-start;line-height:1.5}.warn{color:#8a5500;background:#fff8e7;border-radius:10px;padding:12px}.library{display:grid;gap:9px}.action{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid #dce3eb;border-radius:10px}.action-name{font-weight:650;flex:1}.empty{color:#728095}.spatial-head{justify-content:space-between}.ik-layout{display:grid;grid-template-columns:minmax(340px,1.35fr) minmax(220px,.65fr);gap:18px;align-items:center;margin-top:18px}.viewport{height:370px;background:#101827;border-radius:12px;overflow:hidden;touch-action:none}.viewport canvas{display:block;width:100%;height:100%}.readout{display:grid;gap:12px;font-variant-numeric:tabular-nums}.log{font:13px ui-monospace,monospace;background:#111927;color:#c9d5e5;border-radius:9px;padding:13px;min-height:38px;white-space:pre-wrap}@media(max-width:700px){body{padding:12px}.action{align-items:flex-start;flex-wrap:wrap}.ik-layout{grid-template-columns:1fr}.viewport{height:300px}}</style></head>
<body><main class="wrap"><section class="panel"><h2>A1R 拖动示教动作库</h2><div class="status"><span id="dot" class="dot"></span><span id="status">连接中…</span></div></section>
<section class="panel"><div class="toolbar"><b>选择机械臂</b><button id="rightArm" class="primary">右臂 A1R</button><button id="leftArm">左臂 A1L</button><span id="armDevice" class="empty">右臂 · 2097368F4343</span></div></section>
<section class="panel warn"><b>安全：</b>机械臂无自动避障且无抱闸。录制前托住机械臂并确认零点；回放或三维控制前清空工作区并准备急停。</section>
<section class="panel"><label class="confirm"><input id="armed" type="checkbox"><span>我已确认安装牢固、零点正确、工作区无人无障碍，并已准备急停。</span></label></section>
<section class="panel"><h3>录制新动作</h3><div class="toolbar"><label>自定义动作名称<input id="actionName" type="text" maxlength="26" placeholder="例如：坐下、招手、拿东西"></label><button id="record" class="primary">开始录制</button><button id="stopRecord" class="stoprec" disabled>停止并另存为新动作</button></div></section>
<section class="panel"><h3>动作库（永不覆盖）</h3><div id="library" class="library"><div class="empty">尚无动作</div></div></section>
<section class="panel"><div class="toolbar spatial-head"><div><h3 style="margin-bottom:5px">三维空间末端控制</h3><div class="empty">默认关闭，需要时手动开启。</div></div><button id="spatialToggle" class="primary">开启三维末端控制</button></div><div id="spatialPanel" class="ik-layout" hidden><div id="ik3d" class="viewport"></div><div class="readout"><div id="pose">末端位置：未开启</div><div id="delta">空间偏移：X 0 · Y 0 · Z 0 cm</div><label>速度比例<input id="speed" type="number" min="0.05" max="0.20" step="0.01" value="0.12"></label><div class="warn">拖动彩色坐标轴，松手执行 MoveP。每轴最多 8 cm，总位移最多 10 cm。</div></div></div></section>
<section class="panel"><button id="stop" class="danger">立即停止示教/回放/运动</button></section><section class="panel"><div id="log" class="log">等待状态…</div></section></main>
<script>
const armed=document.getElementById('armed'),log=document.getElementById('log'),library=document.getElementById('library');let state={recording:false,replaying:false,actions:[]},busy=false,spatialEnabled=false,selectedArm='right';
function apiBase(){return selectedArm==='right'?'':`${location.protocol}//${location.hostname}:8081`}
async function api(path,method='GET'){const r=await fetch(apiBase()+path,{method});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||'请求失败');return j}
function render(){document.getElementById('dot').classList.add('ok');document.getElementById('status').textContent=state.recording?'正在零力录制':state.replaying?'正在回放动作':spatialEnabled?'已连接 · 三维末端控制已开启':'已连接 · 拖动示教待命';document.getElementById('record').disabled=!armed.checked||state.recording||state.replaying||spatialEnabled||busy;document.getElementById('stopRecord').disabled=!state.recording||busy;document.getElementById('spatialToggle').disabled=state.recording||state.replaying||busy;if(!state.actions.length)library.innerHTML='<div class="empty">尚无已保存动作</div>';else library.innerHTML=state.actions.map(a=>`<div class="action"><span class="action-name"></span><button class="play" data-id="${a.id}" ${!armed.checked||state.recording||state.replaying||spatialEnabled||busy?'disabled':''}>调用</button><button class="delete danger" data-id="${a.id}" ${state.recording||state.replaying||busy?'disabled':''}>删除</button></div>`).join('');[...library.querySelectorAll('.action-name')].forEach((e,i)=>e.textContent=state.actions[i].name);library.querySelectorAll('.play').forEach(b=>b.onclick=()=>play(b.dataset.id));library.querySelectorAll('.delete').forEach(b=>b.onclick=()=>removeAction(b.dataset.id))}
async function refresh(){try{state=await api('/api/status');render()}catch(e){document.getElementById('dot').classList.remove('ok');document.getElementById('status').textContent='连接异常';log.textContent='错误：'+e.message}}
armed.onchange=render;
async function selectArm(side){if(state.recording||state.replaying||busy){log.textContent='请先停止当前录制或回放';return}if(spatialEnabled){try{await api('/api/spatial/disable','POST')}catch{}spatialEnabled=false;document.getElementById('spatialPanel').hidden=true;document.getElementById('spatialToggle').textContent='开启三维末端控制';document.getElementById('spatialToggle').className='primary'}selectedArm=side;armed.checked=false;document.getElementById('rightArm').className=side==='right'?'primary':'';document.getElementById('leftArm').className=side==='left'?'primary':'';document.getElementById('armDevice').textContent=side==='right'?'右臂 · 2097368F4343':'左臂 · 209836A04343';document.querySelector('h2').textContent=side==='right'?'A1R 右臂拖动示教动作库':'A1L 左臂拖动示教动作库';await refresh()}
document.getElementById('rightArm').onclick=()=>selectArm('right');document.getElementById('leftArm').onclick=()=>selectArm('left');
document.getElementById('spatialToggle').onclick=async()=>{if(!spatialEnabled&&!armed.checked){log.textContent='开启三维控制前请先完成安全确认';return}try{busy=true;render();if(spatialEnabled){const r=await api('/api/spatial/disable','POST');spatialEnabled=false;document.getElementById('spatialPanel').hidden=true;document.getElementById('spatialToggle').textContent='开启三维末端控制';document.getElementById('spatialToggle').className='primary';log.textContent=r.message}else{const r=await api('/api/spatial/enable','POST');spatialEnabled=true;document.getElementById('spatialPanel').hidden=false;document.getElementById('spatialToggle').textContent='关闭三维末端控制';document.getElementById('spatialToggle').className='danger';await window.syncPose();log.textContent=r.message}}catch(e){spatialEnabled=false;document.getElementById('spatialPanel').hidden=true;log.textContent='错误：'+e.message}finally{busy=false;refresh()}};
document.getElementById('record').onclick=async()=>{const name=document.getElementById('actionName').value.trim();if(!armed.checked||!name){log.textContent='请填写动作名称并完成安全确认';return}try{busy=true;render();const r=await api('/api/record/start?name='+encodeURIComponent(name),'POST');log.textContent=r.message+'，请缓慢拖动机械臂'}catch(e){log.textContent='错误：'+e.message}finally{busy=false;refresh()}};
document.getElementById('stopRecord').onclick=async()=>{try{busy=true;render();const r=await api('/api/record/stop','POST');log.textContent=r.message;document.getElementById('actionName').value=''}catch(e){log.textContent='错误：'+e.message}finally{busy=false;refresh()}};
async function play(id){try{busy=true;render();const r=await api('/api/play?id='+id,'POST');state.replaying=true;log.textContent=r.message}catch(e){log.textContent='错误：'+e.message}finally{busy=false;await refresh()}}
async function removeAction(id){const a=state.actions.find(x=>x.id===id);if(!confirm(`确定永久删除动作“${a?.name||id}”吗？`))return;try{busy=true;render();const r=await api('/api/delete?id='+id,'POST');log.textContent=r.message}catch(e){log.textContent='错误：'+e.message}finally{busy=false;refresh()}}
document.getElementById('stop').onclick=async()=>{try{const r=await api('/api/stop','POST');log.textContent=r.message}catch(e){log.textContent='错误：'+e.message}finally{busy=false;refresh()}};
window.ui={api,get state(){return state},get busy(){return busy},set busy(v){busy=v;render()},get spatial(){return spatialEnabled}};refresh();setInterval(refresh,1800);
</script>
<script type="module">
import * as THREE from'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{TransformControls}from'three/addons/controls/TransformControls.js';const host=document.getElementById('ik3d'),scene=new THREE.Scene();scene.background=new THREE.Color(0x101827);const camera=new THREE.PerspectiveCamera(42,1,.01,10);camera.position.set(-.82,.58,.78);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));host.appendChild(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(-.24,0,.24);scene.add(new THREE.HemisphereLight(0xffffff,0x334155,2.1));scene.add(new THREE.GridHelper(.9,9,0x607089,0x334155));const point=new THREE.Mesh(new THREE.SphereGeometry(.014,24,18),new THREE.MeshStandardMaterial({color:0xffffff}));scene.add(point);const anchor=new THREE.Vector3(),transform=new TransformControls(camera,renderer.domElement);transform.attach(point);transform.setMode('translate');transform.setSpace('world');scene.add(transform.getHelper());let dragging=false;function clamp(){const d=point.position.clone().sub(anchor);d.x=THREE.MathUtils.clamp(d.x,-.08,.08);d.y=THREE.MathUtils.clamp(d.y,-.08,.08);d.z=THREE.MathUtils.clamp(d.z,-.08,.08);if(d.length()>.10)d.setLength(.10);point.position.copy(anchor).add(d);document.getElementById('delta').textContent=`空间偏移：X ${(d.x*100).toFixed(1)} · Y ${(d.y*100).toFixed(1)} · Z ${(d.z*100).toFixed(1)} cm`}
async function syncPose(){if(!window.ui.spatial||window.ui.busy)return;const r=await window.ui.api('/api/pose');const p=r.pose;anchor.set(p.x,p.y,p.z);point.position.copy(anchor);clamp();document.getElementById('pose').textContent=`末端位置：X ${(p.x*100).toFixed(1)} · Y ${(p.y*100).toFixed(1)} · Z ${(p.z*100).toFixed(1)} cm`}window.syncPose=syncPose;transform.addEventListener('mouseDown',()=>dragging=true);transform.addEventListener('objectChange',clamp);transform.addEventListener('dragging-changed',e=>orbit.enabled=!e.value);transform.addEventListener('mouseUp',async()=>{if(!dragging)return;dragging=false;const d=point.position.clone().sub(anchor);if(!window.ui.spatial||!armed.checked||window.ui.busy||d.length()<.003){point.position.copy(anchor);clamp();return}window.ui.busy=true;try{const q=new URLSearchParams({dx:d.x,dy:d.y,dz:d.z,speed:document.getElementById('speed').value});const r=await window.ui.api('/api/end-move?'+q,'POST');log.textContent=r.message}catch(e){log.textContent='错误：'+e.message}finally{window.ui.busy=false;await syncPose()}});function resize(){renderer.setSize(host.clientWidth||600,host.clientHeight||370,false);camera.aspect=(host.clientWidth||600)/(host.clientHeight||370);camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(host);resize();renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera)});setInterval(()=>syncPose().catch(()=>{}),2500);
</script></body></html>
